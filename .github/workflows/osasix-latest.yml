# Osasix Remote - compila la ULTIMA version oficial de RustDesk (Windows x64) con la marca de Osasix.
#
# Se lanza a mano: Actions -> "Osasix Remote - Ultima version (Windows)" -> Run workflow.
#  1. Consulta la ultima version publicada en rustdesk/rustdesk.
#  2. Si ya tiene release en este repositorio, termina sin compilar (salvo "force").
#  3. Si no, descarga ese codigo, aplica .github/branding/apply-branding.ps1 y compila.
#  4. Crea un release BORRADOR "osasix-<version>-r<n>" con el .zip y el .exe portable
#     (tambien quedan como artefactos de la ejecucion).
name: Osasix Remote - Ultima version (Windows)

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Compilar aunque esa version ya tenga release"
        type: boolean
        default: false
      version:
        description: "Version concreta de RustDesk, p. ej. 1.5.3 (vacio = la ultima)"
        type: string
        default: ""

permissions:
  contents: read

env:
  UPSTREAM: rustdesk/rustdesk
  TARGET: x86_64-pc-windows-msvc
  VCPKG_TRIPLET: x64-windows-static

jobs:
  # ---------------------------------------------------------------------------------------
  check:
    runs-on: ubuntu-22.04
    permissions:
      contents: write # necesario para ver los releases en borrador
    env:
      GH_TOKEN: ${{ github.token }}
      IN_VERSION: ${{ inputs.version }}
      IN_FORCE: ${{ inputs.force }}
    outputs:
      build: ${{ steps.decide.outputs.build }}
      version: ${{ steps.decide.outputs.version }}
      flutter: ${{ steps.vers.outputs.flutter }}
      rust: ${{ steps.vers.outputs.rust }}
      llvm: ${{ steps.vers.outputs.llvm }}
      vcpkg: ${{ steps.vers.outputs.vcpkg }}
      cargo_expand: ${{ steps.vers.outputs.cargo_expand }}
      frb: ${{ steps.vers.outputs.frb }}
      bridge_rust: ${{ steps.vers.outputs.bridge_rust }}
      bridge_flutter: ${{ steps.vers.outputs.bridge_flutter }}
    steps:
      - name: Decide si hay que compilar
        id: decide
        run: |
          set -euo pipefail
          VER="${IN_VERSION}"
          if [ -z "$VER" ]; then
            VER=$(gh api "repos/${UPSTREAM}/releases/latest" --jq .tag_name)
          fi
          echo "Version de RustDesk: $VER"
          BUILD=true
          if gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' | grep -qF "osasix-${VER}-r"; then
            if [ "$IN_FORCE" = "true" ]; then
              echo "Ya existe un release de $VER, pero se fuerza la compilacion."
            else
              BUILD=false
              echo "Ya existe un release de $VER: no hay nada que compilar."
            fi
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          {
            echo "### Osasix Remote"
            echo "- Version oficial de RustDesk: **$VER**"
            if [ "$BUILD" = "true" ]; then echo "- Resultado: se compila."; else echo "- Resultado: ya compilada, no se hace nada (usa *force* para repetirla)."; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Leer versiones de herramientas del workflow oficial de esa version
        id: vers
        if: steps.decide.outputs.build == 'true'
        env:
          VER: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/${UPSTREAM}/${VER}/.github/workflows"
          curl -fsSL "$base/flutter-build.yml" -o fb.yml
          curl -fsSL "$base/bridge.yml" -o br.yml
          val() { grep -m1 -E "^[[:space:]]*$2:" "$1" | sed -E 's/^[^:]*:[[:space:]]*"?([^" #]+).*/\1/'; }
          flutter=$(val fb.yml FLUTTER_VERSION)
          rust=$(val fb.yml SCITER_RUST_VERSION)
          llvm=$(val fb.yml LLVM_VERSION)
          vcpkg=$(val fb.yml VCPKG_COMMIT_ID)
          cargo_expand=$(val br.yml CARGO_EXPAND_VERSION)
          frb=$(val br.yml FLUTTER_RUST_BRIDGE_VERSION)
          bridge_rust=$(val br.yml RUST_VERSION)
          bridge_flutter=$(grep -m1 'flutter-version:' br.yml | sed -E 's/.*"([^"]+)".*/\1/')
          for kv in flutter=$flutter rust=$rust llvm=$llvm vcpkg=$vcpkg cargo_expand=$cargo_expand frb=$frb bridge_rust=$bridge_rust bridge_flutter=$bridge_flutter; do
            echo "$kv"
            if [ -z "${kv#*=}" ]; then echo "::error::No se pudo leer ${kv%%=*} del workflow oficial de $VER"; exit 1; fi
            echo "$kv" >> "$GITHUB_OUTPUT"
          done

  # ---------------------------------------------------------------------------------------
  bridge:
    needs: [check]
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout RustDesk oficial
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.check.outputs.version }}
          path: rd
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get install ca-certificates -y
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl gcc git g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ needs.check.outputs.bridge_rust }}
          targets: x86_64-unknown-linux-gnu
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: osasix-bridge

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ needs.check.outputs.bridge_flutter }}
          cache: true

      - name: Install flutter rust bridge deps
        working-directory: rd
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ needs.check.outputs.cargo_expand }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ needs.check.outputs.frb }} --features "uuid" --locked
          if [[ "${{ needs.check.outputs.bridge_flutter }}" == "3.22.3" ]]; then
            sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          fi
          pushd flutter && flutter pub get && popd

      - name: Run flutter rust bridge
        working-directory: rd
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload bridge
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge-latest
          path: |
            rd/src/bridge_generated.rs
            rd/src/bridge_generated.io.rs
            rd/flutter/lib/generated_bridge.dart
            rd/flutter/lib/generated_bridge.freezed.dart
            rd/flutter/macos/Runner/bridge_generated.h
            rd/flutter/ios/Runner/bridge_generated.h

  # ---------------------------------------------------------------------------------------
  build-windows:
    needs: [check, bridge]
    if: needs.check.outputs.build == 'true'
    runs-on: windows-2022
    permissions:
      contents: write # para crear el release en borrador
    env:
      VER: ${{ needs.check.outputs.version }}
      FLUTTER_VERSION: ${{ needs.check.outputs.flutter }}
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout Osasix (scripts de marca)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: osasix

      - name: Checkout RustDesk oficial
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ env.VER }}
          path: rd
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-latest
          path: ./rd

      - name: Aplicar marca de Osasix
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./osasix/.github/branding/apply-branding.ps1 -Root "$PWD/rd"

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ needs.check.outputs.llvm }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # https://github.com/flutter/flutter/issues/155685
      - name: Replace engine with rustdesk custom flutter engine
        shell: pwsh
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          $fr = Split-Path (Split-Path (Get-Command flutter).Source)
          Move-Item -Force "windows-x64-release/*" "$fr/bin/cache/artifacts/engine/windows-x64-release/"

      - name: Patch flutter
        shell: bash
        run: |
          PATCH="$PWD/rd/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
          if [ "$FLUTTER_VERSION" = "3.24.5" ] && [ -f "$PATCH" ]; then
            cp "$PATCH" $(dirname $(dirname $(which flutter)))
            cd $(dirname $(dirname $(which flutter)))
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          else
            echo "Sin parche de flutter (version $FLUTTER_VERSION)"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ needs.check.outputs.rust }}
          targets: ${{ env.TARGET }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: osasix-windows-2022
          workspaces: rd

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ needs.check.outputs.vcpkg }}
          doNotCache: false

      - name: Install vcpkg dependencies
        working-directory: rd
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ env.VCPKG_TRIPLET }}
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet ${{ env.VCPKG_TRIPLET }} --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"; echo "======"; cat "$_1"; echo "======"
            done
            exit 1
          fi

      - name: Build Osasix Remote
        working-directory: rd
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./osasix-remote

          # Controlador de monitor virtual (pantalla de privacidad)
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./osasix-remote

      - name: Copy Runner.res for the portable packer
        continue-on-error: true
        shell: bash
        working-directory: rd
        run: |
          runner_res=$(find . -name "Runner.res" | head -n 1)
          if [ -n "$runner_res" ]; then cp "$runner_res" ./libs/portable/Runner.res; fi

      # Un solo .exe autoextraible (opcional: si falla, el .zip sigue siendo valido)
      - name: Build single-file portable exe
        continue-on-error: true
        shell: bash
        working-directory: rd
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../osasix-remote/ -e rustdesk.exe -l 11 -t "${{ env.TARGET }}"
          popd

      - name: Collect outputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "rd/osasix-remote/*" -DestinationPath "dist/Osasix-Remote-$env:VER-windows-x64.zip"
          $p = "rd/target/$env:TARGET/release/rustdesk-portable-packer.exe"
          if (Test-Path $p) {
            Copy-Item $p "dist/Osasix-Remote-$env:VER-portable.exe"
          } else {
            Write-Warning "No se genero el .exe portable; solo hay .zip"
          }
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osasix-remote-${{ env.VER }}
          path: dist

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="osasix-${VER}-r${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --draft \
            --title "Osasix Remote ${VER}" \
            --notes "Compilacion de RustDesk ${VER} con la marca de Osasix (servidor remote.osasix.com). Release en borrador: probar antes de publicar."
          echo "### Release en borrador: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
